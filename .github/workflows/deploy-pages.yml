name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - feature/parent-child-supabase-auth
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Use project npm version
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: npm ci
      - name: Build Angular app
        run: npm run build -- --base-href /dhaniFitness/
      - name: Add SPA fallback
        run: cp dist/DhaniFitness/browser/index.html dist/DhaniFitness/browser/404.html
      - name: Include custom domain configuration
        run: cp CNAME dist/DhaniFitness/browser/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/DhaniFitness/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
